workflows:
  sudoku-ios:
    name: Sudoku iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120

    # In Codemagic, create an App Store Connect integration named APP_STORE_CONNECT.
    integrations:
      app_store_connect: APP_STORE_CONNECT

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dk.sudoku.app2026
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync the web game to the iOS project
        script: npx cap sync ios
      - name: Configure code signing
        script: xcode-project use-profiles
      - name: Build signed iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
